CONFIG_MAIN_STACK_SIZE=4096
# o download roda na thread do shell: pilha curta ali corrompe a pilha e trava
CONFIG_SHELL_STACK_SIZE=8192

CONFIG_LOG=y
CONFIG_SHELL=y

# rede
CONFIG_NETWORKING=y
CONFIG_NET_IPV4=y
CONFIG_NET_DHCPV4=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_TCP=y
CONFIG_DNS_RESOLVER=y
CONFIG_NET_MGMT=y
CONFIG_NET_MGMT_EVENT=y
CONFIG_NET_MGMT_EVENT_INFO=y

CONFIG_WIFI=y

# rede da sala: troque estes dois
CONFIG_LAB9_WIFI_SSID="workshop"
CONFIG_LAB9_WIFI_PSK="senha-da-sala"

# atualizacao por HTTP
CONFIG_BOOTLOADER_MCUBOOT=y
CONFIG_OTA_HTTP=y
CONFIG_OTA_HTTP_SHELL=y

CONFIG_NET_BUF_RX_COUNT=32
CONFIG_NET_BUF_TX_COUNT=32
CONFIG_NET_PKT_RX_COUNT=16
CONFIG_NET_PKT_TX_COUNT=16
