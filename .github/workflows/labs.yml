name: labs

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # The labs are built against Zephyr main, which moves under us. Run weekly
    # so a breaking upstream change surfaces before the workshop, not during it.
    - cron: '0 6 * * 1'

jobs:
  twister:
    name: twister on native_sim
    runs-on: ubuntu-latest

    env:
      # native_sim builds with the host compiler, so no Zephyr SDK is needed.
      ZEPHYR_TOOLCHAIN_VARIANT: host

    steps:
      - name: Checkout the workshop
        uses: actions/checkout@v4
        with:
          path: workshop

      - name: Install host build dependencies
        run: |
          sudo apt-get update
          # native_sim produces a 32-bit binary, hence multilib.
          sudo apt-get install --no-install-recommends -y \
            cmake ninja-build gperf device-tree-compiler \
            gcc-multilib g++-multilib

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install west
        run: pip install west

      - name: Set up the Zephyr workspace
        run: |
          west init -m https://github.com/zephyrproject-rtos/zephyr --mr main zephyrproject
          cd zephyrproject
          west update --narrow -o=--depth=1

      - name: Install Zephyr Python dependencies
        run: |
          pip install -r zephyrproject/zephyr/scripts/requirements-base.txt
          pip install -r zephyrproject/zephyr/scripts/requirements-run-test.txt

      - name: Run twister
        working-directory: zephyrproject/zephyr
        run: |
          west twister \
            -T "$GITHUB_WORKSPACE/workshop/labs" \
            -p native_sim \
            --inline-logs -v

      - name: Upload twister output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: twister-out
          path: zephyrproject/zephyr/twister-out/**/handler.log
          if-no-files-found: ignore
